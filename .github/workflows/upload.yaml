name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
      with:
        tools: calcit,caps

    - name: Install dependencies
      run: |
        caps --strict --ci
        yarn install --immutable

    - name: Verify exact toolchain
      run: |
        calcit --version
        caps --version
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        yarn check
        calcit calcit.cirru analyze dynamic-methods --max 0
        yarn check:deprecated
        yarn check:quality

    - name: Validate documentation
      run: calcit calcit.cirru docs check-md README.md --entry calcit.cirru --failures-only

    - name: Build browser client
      run: yarn build:js

    - name: Verify deployment host key
      run: |
        host_count="$(awk '$1 == "tiye.me" { count += 1 } END { print count + 0 }' .github/ssh_known_hosts)"
        test "$host_count" -eq 1
        host_key="$(awk '$1 == "tiye.me" { print $2 " " $3 }' .github/ssh_known_hosts)"
        actual_fingerprint="$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{ print $2 }')"
        test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        test -n "$DEPLOY_KEY"
        ssh_dir="$RUNNER_TEMP/respo-value-ssh"
        key_file="$ssh_dir/id_ed25519"
        known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
        install -d -m 700 "$ssh_dir"
        install -m 600 /dev/null "$key_file"
        printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
        trap 'rm -f "$key_file"' EXIT
        rsync -avzr --progress \
          -e "ssh -i $key_file -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
          dist/ "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/"
