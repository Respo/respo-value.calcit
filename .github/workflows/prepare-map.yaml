name: Prepare reviewed Map migration
on:
  push:
    branches: [prepare/value-map-alpha5]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Original alpha4 baseline gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.31.0-alpha.4"
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --quiet -- calcit.cirru deps.cirru package.json yarn.lock
          bash reviewed-gates.sh > acceptance-before.log 2>&1
      - name: Official scoped source transaction
        run: node apply-reviewed.mjs apply
      - name: Full after-source alpha4 gates
        run: |
          set -euo pipefail
          bash reviewed-gates.sh > acceptance-after-source.log 2>&1
          node apply-reviewed.mjs paired-baseline
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Paired alpha5 original gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.31.0-alpha.5"
          caps --strict --ci
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          node apply-reviewed.mjs target-api
          bash reviewed-gates.sh > acceptance-alpha5.log 2>&1
          node apply-reviewed.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: value-map455-diagnostics
          path: |
            acceptance
            acceptance-*.log
          if-no-files-found: error
          retention-days: 30
